<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quentin Tarantino Movies</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#0a0a0a;
      font-family:'Poppins',sans-serif;
      color:white;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    /* =========================
       PAGE
    ==========================*/

    .page{
      width:100%;
      min-height:100vh;
      padding:30px 40px 60px;
      background:#0b0b0b;
    }

    /* =========================
       TOP BAR
    ==========================*/

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:30px;
    }

    .icon{
      font-size:30px;
      cursor:pointer;
      color:rgb(255, 255, 255);
      transition:0.3s;
    }

    .icon:hover{
      transform:scale(1.1);
      color:#f5c518;
    }

    /* =========================
       LOGO
    ==========================*/

    .logo{
      text-align:center;
      margin-bottom:40px;
    }

    .logo h1{
      color:#f5c518;
      font-size:70px;
      line-height:0.9;
      text-transform:uppercase;
      font-weight:800;
      letter-spacing:-3px;
    }

    /* =========================
       SECTION TITLE
    ==========================*/

    .section-title{
      margin-bottom:30px;
    }

    .section-title h2{
      font-size:32px;
      font-weight:700;
      text-transform:uppercase;
      display:inline-block;
      position:relative;
    }

    .section-title h2::after{
      content:"";
      position:absolute;
      left:0;
      bottom:-8px;
      width:120px;
      height:6px;
      background:#2ca8ff;
    }

    /* =========================
       MOVIE GRID
    ==========================*/

    .movie-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:50px;
      margin-bottom:90px;
    }

    /* =========================
       MOVIE CARD
    ==========================*/

    .movie-card{
      transition:0.35s ease;
      cursor:pointer;
    }

    .movie-card:hover{
      transform:translateY(-10px) scale(1.03);
    }

    .movie-image{
      width:100%;
      height:320px;
      overflow:hidden;
      background:#111;
      margin-bottom:16px;
    }

    .movie-image img{
      width:100%;
      height:100%;
      object-fit:cover;
      transition:0.4s ease;
    }

    .movie-card:hover img{
      transform:scale(1.08);
    }

    .movie-title{
      font-size:22px;
      font-weight:600;
      line-height:1.3;
    }

    /* =========================
       QUOTE
    ==========================*/

    .quote{
      text-align:center;
      margin:80px auto;
      max-width:1000px;
    }

    .quote p{
      color:#f5c518;
      font-size:42px;
      line-height:1.4;
      font-weight:700;
    }

   

    /* =========================
       MOBILE
    ==========================*/

    @media(max-width:768px){

      .page{
        padding:25px;
      }

      .logo h1{
        font-size:50px;
      }

      .quote p{
        font-size:28px;
      }

      .movie-image{
        height:280px;
      }

      .movie-title{
        font-size:18px;
      }

    }

  </style>
</head>
<body>

  <div class="page">

    <!-- TOPBAR -->
    <div class="topbar">

      <div class="icon" id="searchBtn">
        🔍
      </div>

      <div class="icon" id="menuBtn">

      </div>

    </div>

    <!-- LOGO -->
    <div class="logo">

      </h1>
    </div>

    <!-- TITLE -->
    <div class="section-title">
      <h2>Movies</h2>
    </div>

    <!-- MOVIES -->
    <div class="movie-grid">

      <!-- CARD -->
      <div class="movie-card">
        <div class="movie-image">
          <img src="https://m.media-amazon.com/images/I/81UTs3sA8JL.jpg" alt="">
        </div>

        <div class="movie-title">
          Pulp Fiction
        </div>
      </div>

      <!-- CARD -->
      <div class="movie-card">
        <div class="movie-image">

        </div>

        <div class="movie-title">
          Kill Bill | Vol. 1
        </div>
      </div>

      <!-- CARD -->
      <div class="movie-card">
        <div class="movie-image">

        </div>

        <div class="movie-title">
          Django Unchained
        </div>
      </div>

      <!-- CARD -->
      <div class="movie-card">
        <div class="movie-image">
          <img src="https://m.media-amazon.com/images/I/71hP2Q0K0DL.jpg" alt="">
        </div>

        <div class="movie-title">
          The Hateful Eight
        </div>
      </div>

      <!-- CARD -->
      <div class="movie-card">
        <div class="movie-image">
          <img src="https://m.media-amazon.com/images/I/81M0k8J5tBL.jpg" alt="">
        </div>

        <div class="movie-title">
          Grindhouse
        </div>
      </div>

      <!-- CARD -->
      <div class="movie-card">
        <div class="movie-image">
          <img src="https://m.media-amazon.com/images/I/91x0-7k6KgL.jpg" alt="">
        </div>

        <div class="movie-title">
          Inglorious Bastards
        </div>
      </div>

      <!-- CARD -->
      <div class="movie-card">
        <div class="movie-image">
          <img src="https://m.media-amazon.com/images/I/81M0sM4T3kL.jpg" alt="">
        </div>

        <div class="movie-title">
          Jackie Brown
        </div>
      </div>

      <!-- CARD -->
      <div class="movie-card">
        <div class="movie-image">
          <img src="https://m.media-amazon.com/images/I/71X6Q6h7zKL.jpg" alt="">
        </div>

        <div class="movie-title">

        </div>
      </div>

      <!-- CARD -->
      <div class="movie-card">
        <div class="movie-image">
          <img src="https://m.media-amazon.com/images/I/81o9sJ5M3SL.jpg" alt="">
        </div>

        <div class="movie-title">
          Once Upon A Time In Hollywood
        </div>
      </div>

    </div>

    <!-- QUOTE -->
    <div class="quote">
      <p>
        "Gentlemen, you had my curiosity... but now you have my attention."
        – Calvin Candie.
      </p>
    </div>

    

  </div>

  <script>

    // SEARCH BUTTON
    document.getElementById("searchBtn")
    .addEventListener("click", () => {

      alert("Search Clicked");

    });

    // MENU BUTTON
    document.getElementById("menuBtn")
    .addEventListener("click", () => {

      alert("Menu Opened");

    });

    // MOVIE CARD CLICK
    const cards = document.querySelectorAll(".movie-card");

    cards.forEach(card => {

      card.addEventListener("click", () => {

        const title = card.querySelector(".movie-title").innerText;

        alert(title);

      });

    });

  </script>

</body>
</html>
